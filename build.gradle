plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.143'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-${minecraft_version}-neoforge"
}

// mods.toml's version = "${file.jarVersion}" resolves from this manifest attribute at mod load.
tasks.named('jar', Jar) {
    manifest {
        attributes(['Implementation-Version': project.version])
    }
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            programArguments.addAll '--username', 'Dev1'
        }

        // Second client for two-player testing (separate game dir + username).
        client2 {
            client()
            gameDirectory = file('run2')
            programArguments.addAll '--username', 'Dev2'
        }

        server {
            server()
            programArgument '--nogui'
            gameDirectory = file('run-server')
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    // Dev-runtime-only test mods for the item picker (TACZ/SuperbWarfare namespaces).
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
    // Kotlin for Forge (NeoForge line) - SuperbWarfare (Kotlin-based) needs this language provider present at runtime
    maven {
        name = 'KotlinForForge'
        url = 'https://thedarkcolour.github.io/KotlinForForge/'
    }
}

dependencies {
    // The item picker itself never compiles against TACZ/SuperbWarfare classes - it only matches
    // ResourceLocation namespaces at runtime. These are dev-runtime-only conveniences so it has
    // real tacz:/superbwarfare: items to show while testing.
    // TACZ NeoForge 1.21.1 port is a different CurseForge project than the old legacy-Forge TACZ,
    // and ships already Mojmap-named, so plain compileOnly/runtimeOnly (no SRG remap) suffices.
    runtimeOnly 'curse.maven:tacz-1-21-1-1353462:8547439'
    runtimeOnly 'curse.maven:superb-warfare-1218165:8104860'
    // SuperbWarfare is written in Kotlin and needs this language provider (NeoForge line) to load.
    runtimeOnly 'thedarkcolour:kotlinforforge-neoforge:5.12.0'
    runtimeOnly 'curse.maven:geckolib-388172:8350073'
    runtimeOnly 'curse.maven:curios-309927:6529130'

    // Ammo-resupply gadget integration (compat/tacz, compat/superbwarfare) is a soft compile-time
    // dependency, isolated behind ModList.isLoaded guards exactly like squadtp's TaczCompat -
    // never shipped, never required, and the guarded classes are only classloaded when present.
    compileOnly 'curse.maven:tacz-1-21-1-1353462:8547439'
    compileOnly 'curse.maven:superb-warfare-1218165:8104860'
}
